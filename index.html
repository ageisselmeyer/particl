<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PartiCl</title>

<style>
body{
background:#ffffff;
color:#0a2340;
font-family:Arial,Helvetica,sans-serif;
text-align:center;
margin:0;
padding:12px;
}

/* Galaxy/space style for all buttons and file input */
button,
input[type="file"]{
background:#ffffff;
color:#0a2340;
border:1px solid rgba(60, 120, 220, 0.35);
border-radius:12px;
padding:12px 24px;
margin:10px;
font-size:15px;
font-weight:600;
letter-spacing:0.06em;
text-transform:uppercase;
box-shadow:0 0 10px rgba(80, 120, 200, 0.10), inset 0 1px 0 rgba(255,255,255,0.9);
transition:border-color 0.2s, box-shadow 0.2s, transform 0.15s;
cursor:pointer;
}
button:hover,
input[type="file"]:hover{
border-color:rgba(70, 130, 230, 0.6);
box-shadow:0 0 16px rgba(90, 140, 230, 0.18), inset 0 1px 0 rgba(255,255,255,0.95);
transform:translateY(-1px);
}
button:active,
input[type="file"]:active{
transform:translateY(0);
box-shadow:0 0 14px rgba(100, 150, 255, 0.2);
}
input[type="file"]{
font-family:inherit;
}
input[type="file"]::file-selector-button{
background:transparent;
color:inherit;
border:none;
font:inherit;
padding:0;
margin-right:10px;
cursor:pointer;
}

canvas{
background:#ffffff;
border-radius:16px;
margin-top:20px;
}

#canvasWrap{
position:relative;
width:min(92vw,620px);
height:min(92vw,620px);
margin:20px auto 0;
overflow:hidden;
background:#ffffff;
border-radius:16px;
}

#bg,#tx{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
margin-top:0;
}

/* Let the WebGL galaxy show through */
#bg{ background:#ffffff; }
#tx{ background:transparent; }

#videoWrap{
position:relative;
width:min(90vw,480px);
height:min(90vw,480px); /* square box for camera */
margin:20px auto 0;
min-height:200px;
border:1px solid rgba(255,255,255,0.25);
border-radius:10px;
overflow:hidden;
}

#videoWrap > video{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
display:block;
border-radius:10px;
object-fit:cover;
object-position:center;
z-index:0;
}

#finderOverlay{ position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; z-index:1; display:none; }
.finder-box{ position:absolute; border:2px solid rgba(0,255,0,0.9); box-sizing:border-box; display:none; }
#particleCloudBox{ position:absolute; border:2px solid rgba(0,255,0,0.85); box-sizing:border-box; display:none; pointer-events:none; }

#download{
display:none;
margin-top:20px;
font-size:18px;
}

#decodeProgressWrap{ text-align:left; }
#decodeProgressText{ min-height:1.2em; text-align:center; font-size:16px !important; }
#status{ font-size:13px; }

#modeButtons{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
flex-wrap:wrap;
}

@media (max-width: 700px){
  body{
    padding:10px;
  }
  h2{
    margin:8px 0 10px;
    font-size:20px;
  }
  button{
    font-size:14px;
    padding:11px 16px;
    margin:6px 4px;
  }
  #videoWrap{
    width:min(94vw,520px);
    height:min(94vw,520px);
    margin-top:14px;
  }
  #decodeProgressWrap{
    max-width:min(94vw,420px) !important;
  }
  #decodeDebug{
    max-width:min(94vw,420px) !important;
    font-size:11px;
    line-height:1.3;
  }
  #status{
    max-width:min(94vw,560px);
    margin-left:auto;
    margin-right:auto;
  }
}
</style>
</head>

<body>

<input type="file" id="fileInput" style="display:none">

  <button onclick="encode()">◇ Encode</button>
  <button onclick="startDecoder()">▷ Decode</button>

<br>

<div id="canvasWrap">

<script>

const canvas = document.getElementById("tx")
const ctx = canvas.getContext("2d")

const bgCanvas = document.getElementById("bg")
let gl = bgCanvas.getContext("webgl2", { antialias:false, alpha:false, premultipliedAlpha:false })
let glKind = "none"
if(gl){
  glKind = "webgl2"
}else{
  gl = bgCanvas.getContext("webgl", { antialias:false, alpha:false, premultipliedAlpha:false }) ||
       bgCanvas.getContext("experimental-webgl", { antialias:false, alpha:false, premultipliedAlpha:false })
  if(gl) glKind = "webgl1"
}
let galaxy = null

const video = document.getElementById("video")
const videoWrapEl = document.getElementById("videoWrap")
const finderTL = document.getElementById("finderTL")
const finderTR = document.getElementById("finderTR")
const finderBR = document.getElementById("finderBR")
const finderBL = document.getElementById("finderBL")
const particleCloudBoxEl = document.getElementById("particleCloudBox")
const statusEl = document.getElementById("status")
const fileInputEl = document.getElementById("fileInput")
const modeButtonsEl = document.getElementById("modeButtons")
const canvasWrapEl = document.getElementById("canvasWrap")
const decodeProgressWrap = document.getElementById("decodeProgressWrap")
const decodeProgressBar = document.getElementById("decodeProgressBar")
const decodeProgressText = document.getElementById("decodeProgressText")
const decodeDebugEl = document.getElementById("decodeDebug")
let decodeRateSamples = []  // { t, have } for ETA
let decodeFramesReceived = 0  // count decoded frames (so user sees activity before meta)
let decodeExpectedTotal = null // best-known total chunk count (K)
const decodeTotalVotes = new Map()
let decodeEstimatedTotal = null
let decodeRecentTotals = []
const MAX_TOTAL_ESTIMATE = 8192

const GRID = 56 // lower density (~half points): larger cells, more robust decode
const CARRIER_RADIUS_SQ = 0.70
const CARRIER_MASK = (() => {
  const m = new Uint8Array(GRID * GRID)
  let idx = 0
  for(let gy=0; gy<GRID; gy++){
    for(let gx=0; gx<GRID; gx++){
      const nx = (gx / (GRID - 1)) * 2 - 1
      const ny = (gy / (GRID - 1)) * 2 - 1
      const rr = nx*nx + ny*ny
      m[idx++] = rr <= CARRIER_RADIUS_SQ ? 1 : 0
    }
  }
  return m
})()
const FRAME_BITS = CARRIER_MASK.reduce((a, b) => a + b, 0)
const SYNC = "1100110011110000101010101100110011001100111100001010101011001100" // 64-bit sync marker
const TOTAL_CHUNKS_BITS = 32 // fixed total-chunks field on every frame
const TOTAL_CHUNKS_REPEATS = 3 // repeat for majority decode robustness
const MAGIC = "VTX2" // 4 bytes (32 bits)
const FILE_ID = (crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint32Array(1))[0] >>> 0 : ((Math.random()*2**32)>>>0)

let frames=[]
let frameIndex=0
let particles=[] // repurposed as precomputed carrier cells
let txMeta = null
let txRun = 0
let txFountain = null
let rxFountain = null
let txPackets = []
let txPacketCursor = 0
let txTotalFrames = 0
let txPayloadBitsPerFrame = 0
let txSessionNonce = 0

function fmt2(n){
  return Number.isFinite(n) ? n.toFixed(2) : "n/a"
}

function considerTotalCandidate(k, minVotes = 2){
  if(!Number.isFinite(k)) return
  const kk = k >>> 0
  // Raw frame-bit totals are noisy; keep strict bounds.
  if(kk < 1 || kk > MAX_TOTAL_ESTIMATE) return
  const n = (decodeTotalVotes.get(kk) || 0) + 1
  decodeTotalVotes.set(kk, n)
  if(n >= minVotes) decodeExpectedTotal = kk
}

function setTotalAuthoritative(k){
  if(!Number.isFinite(k)) return
  const kk = k >>> 0
  if(kk < 1 || kk > 200000) return
  decodeExpectedTotal = kk
  decodeTotalVotes.set(kk, Math.max(10, decodeTotalVotes.get(kk) || 0))
}

function bestTotalVoteCandidate(minVotes = 1){
  let bestK = null
  let bestN = 0
  for(const [k, n] of decodeTotalVotes.entries()){
    if(n < minVotes) continue
    if(n > bestN){
      bestN = n
      bestK = k
    }
  }
  return bestK
}

function considerEstimatedTotal(k){
  if(!Number.isFinite(k)) return
  const kk = k >>> 0
  // UI estimate: keep in sane range only.
  if(kk < 1 || kk > MAX_TOTAL_ESTIMATE) return
  decodeRecentTotals.push(kk)
  if(decodeRecentTotals.length > 9) decodeRecentTotals.shift()
  const freq = new Map()
  for(const v of decodeRecentTotals) freq.set(v, (freq.get(v) || 0) + 1)
  let bestK = null
  let bestN = 0
  for(const [v, n] of freq.entries()){
    if(n > bestN){ bestN = n; bestK = v }
  }
  // Require repeated agreement before showing "~N".
  if(bestK != null && bestN >= 2) decodeEstimatedTotal = bestK
}

function renderDecodeDebug(dbg){
  if(!decodeDebugEl) return
  const lines = []
  lines.push("DECODER DEBUG")
  lines.push(`frame #${dbg.frameNo} | decoded packets: ${decodeFramesReceived}`)
  if(dbg.capture) lines.push(`1) capture: video=${dbg.capture.vw}x${dbg.capture.vh} cropSide=${dbg.capture.side}`)
  if(dbg.marker){
    lines.push(`2) markers: ${dbg.marker.ok ? "OK" : "FAIL"} (${dbg.marker.reason})`)
    lines.push(`   scores C/M/Y/G: ${dbg.marker.cyan}/${dbg.marker.mag}/${dbg.marker.yel}/${dbg.marker.grn}`)
    const tl = dbg.marker.tl || { x: "-", y: "-" }
    const tr = dbg.marker.tr || { x: "-", y: "-" }
    const bl = dbg.marker.bl || { x: "-", y: "-" }
    const br = dbg.marker.br || { x: "-", y: "-" }
    lines.push(`   corners tl(${tl.x},${tl.y}) tr(${tr.x},${tr.y}) bl(${bl.x},${bl.y}) br(${br.x},${br.y})`)
    lines.push(`   minSpan=${dbg.marker.minSpan != null ? dbg.marker.minSpan : "-"}`)
  }
  if(dbg.packet){
    lines.push(`3) homography+sample: ${dbg.packet.ok ? "OK" : "FAIL"} (${dbg.packet.reason})`)
    lines.push(`   lum min/max/thr: ${fmt2(dbg.packet.minL)}/${fmt2(dbg.packet.maxL)}/${fmt2(dbg.packet.thr)}`)
    lines.push(`   best pose: inset=${dbg.packet.inset || 0} scale=${dbg.packet.scale || 1} order=${dbg.packet.order} mode=${dbg.packet.sampleMode || "?"} shift=${dbg.packet.bitShift || 0} off=${dbg.packet.byteOffset || 0}`)
    lines.push(`4) sync: raw=${dbg.packet.syncMatch}/64 inv=${dbg.packet.syncMatchInv}/64 used=${dbg.packet.syncUsed}`)
    lines.push(`5) packet bytes: ${dbg.packet.byteLen}`)
  } else {
    lines.push("3) homography+sample: not reached")
    lines.push("   lum min/max/thr: n/a/n/a/n/a")
    lines.push("   best pose: inset=- order=-")
    lines.push("4) sync: raw=-/64 inv=-/64 used=none")
    lines.push("5) packet bytes: 0")
  }
  if(dbg.parse){
    lines.push(`6) parse: ${dbg.parse.ok ? "OK" : "FAIL"} (${dbg.parse.reason})`)
  } else {
    lines.push("6) parse: not reached")
  }
  if(dbg.ingest){
    lines.push(`7) fountain ingest: ${dbg.ingest}`)
  } else {
    lines.push("7) fountain ingest: no packet ingested")
  }
  decodeDebugEl.textContent = lines.join("\n")
}

function initGalaxy(){
  if(!gl) return null
  try{
    const vsWebgl2 = `#version 300 es
precision highp float;
layout(location=0) in vec4 aSeed; // x,y: screen px, z: depth profile, w: bit (0/1)
uniform float uTime;
uniform vec2 uCanvas;
out vec4 vCol;
out float vGlow;
out vec2 vNdc;
vec3 rotY(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(c*p.x + s*p.z, p.y, -s*p.x + c*p.z); }
vec3 rotX(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(p.x, c*p.y - s*p.z, s*p.y + c*p.z); }
void main(){
  float z = aSeed.z;
  float on = step(0.5, aSeed.w);
  if(on < 0.5){
    vNdc = vec2(2.0, 2.0);
    vCol = vec4(0.0);
    vGlow = 0.0;
    gl_Position = vec4(2.0, 2.0, 0.0, 1.0);
    gl_PointSize = 0.0;
    return;
  }
  vec2 ndc0 = vec2((aSeed.x / uCanvas.x) * 2.0 - 1.0, 1.0 - (aSeed.y / uCanvas.y) * 2.0);
  float rndA = fract(sin(dot(ndc0, vec2(127.1, 311.7))) * 43758.5453123);
  float rndB = fract(sin(dot(ndc0, vec2(269.5, 183.3))) * 43758.5453123);
  float radial = clamp(length(ndc0), 0.0, 1.0);
  float theta = atan(ndc0.y, ndc0.x);
  float w = uTime * 0.42 + radial * 2.0 + rndA * 6.283;
  float swirl = theta + 0.46 * sin(w) + 0.12 * sin(uTime * 0.9 + rndB * 6.283);
  float baseR = radial * (0.66 + 0.12 * rndB);
  float flowR = max(0.015, baseR + 0.05 * sin(w + rndA * 4.0));
  vec2 flow = vec2(cos(swirl), sin(swirl)) * flowR;
  vec2 tangent = vec2(-ndc0.y, ndc0.x);
  vec2 advect = 0.12 * tangent * sin(w * 0.9 + rndB * 6.283) + 0.08 * ndc0 * cos(w * 0.7 + rndA * 6.283);
  vec2 drift = 0.04 * vec2(
    cos(w * 0.8 + rndA * 3.0),
    sin(w * 0.7 + rndB * 4.0)
  ) * (0.35 + 0.65 * (1.0 - radial));
  float depthSeed = (rndA * 2.0 - 1.0) * (0.20 + 0.20 * z);
  float zWave = 0.10 * sin(uTime * 0.75 + radial * 4.2 + rndB * 6.283);
  vec2 cloudXY = ndc0 * 0.38 + flow * 0.25 + advect * 0.8 + drift * 0.8;
  vec3 p = vec3(cloudXY, depthSeed + zWave);
  float cam = 2.75;
  float persp = cam / (cam - p.z);
  persp = mix(1.0, persp, 0.22);
  vec2 ndc = p.xy * 1.77 * persp;
  vNdc = ndc;
  gl_Position = vec4(ndc, 0.0, 1.0);
  float depth01 = clamp((p.z + 1.3) / 2.6, 0.0, 1.0);
  float pulse = 0.985 + 0.03 * sin(uTime * 0.95 + z * 8.0 + rndB * 6.283);
  float vis = on;
  gl_PointSize = mix(5.8, 15.8, depth01) * pulse * vis;
  vec3 deepBlue = vec3(0.02, 0.16, 0.74);
  vec3 lightBlue = vec3(0.11, 0.48, 0.98);
  vec3 onCol = mix(deepBlue, lightBlue, 0.22 + 0.78*depth01) * (0.94 + 0.52*depth01);
  vCol = vec4(onCol, 0.94 * on);
  vGlow = (1.08 * on) * (0.84 + 0.42*depth01);
}`;
    const fsWebgl2 = `#version 300 es
precision highp float;
in vec4 vCol;
in float vGlow;
in vec2 vNdc;
out vec4 outColor;
void main(){
  vec2 uv = gl_PointCoord*2.0 - 1.0;
  float d = dot(uv,uv);
  float core = smoothstep(1.0, 0.28, d);
  float rim = smoothstep(1.0, 0.86, d);
  float a = core * rim * vCol.a;
  outColor = vec4(vCol.rgb * (0.92 + 0.08 * core) * vGlow, a);
}`;
    const vsWebgl1 = `
precision highp float;
attribute vec4 aSeed;
uniform float uTime;
uniform vec2 uCanvas;
varying vec4 vCol;
varying float vGlow;
varying vec2 vNdc;
vec3 rotY(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(c*p.x + s*p.z, p.y, -s*p.x + c*p.z); }
vec3 rotX(vec3 p, float a){ float c=cos(a), s=sin(a); return vec3(p.x, c*p.y - s*p.z, s*p.y + c*p.z); }
void main(){
  float z = aSeed.z;
  float on = step(0.5, aSeed.w);
  if(on < 0.5){
    vNdc = vec2(2.0, 2.0);
    vCol = vec4(0.0);
    vGlow = 0.0;
    gl_Position = vec4(2.0, 2.0, 0.0, 1.0);
    gl_PointSize = 0.0;
    return;
  }
  vec2 ndc0 = vec2((aSeed.x / uCanvas.x) * 2.0 - 1.0, 1.0 - (aSeed.y / uCanvas.y) * 2.0);
  float rndA = fract(sin(dot(ndc0, vec2(127.1, 311.7))) * 43758.5453123);
  float rndB = fract(sin(dot(ndc0, vec2(269.5, 183.3))) * 43758.5453123);
  float radial = clamp(length(ndc0), 0.0, 1.0);
  float theta = atan(ndc0.y, ndc0.x);
  float w = uTime * 0.42 + radial * 2.0 + rndA * 6.283;
  float swirl = theta + 0.46 * sin(w) + 0.12 * sin(uTime * 0.9 + rndB * 6.283);
  float baseR = radial * (0.66 + 0.12 * rndB);
  float flowR = max(0.015, baseR + 0.05 * sin(w + rndA * 4.0));
  vec2 flow = vec2(cos(swirl), sin(swirl)) * flowR;
  vec2 tangent = vec2(-ndc0.y, ndc0.x);
  vec2 advect = 0.12 * tangent * sin(w * 0.9 + rndB * 6.283) + 0.08 * ndc0 * cos(w * 0.7 + rndA * 6.283);
  vec2 drift = 0.04 * vec2(
    cos(w * 0.8 + rndA * 3.0),
    sin(w * 0.7 + rndB * 4.0)
  ) * (0.35 + 0.65 * (1.0 - radial));
  float depthSeed = (rndA * 2.0 - 1.0) * (0.20 + 0.20 * z);
  float zWave = 0.10 * sin(uTime * 0.75 + radial * 4.2 + rndB * 6.283);
  vec2 cloudXY = ndc0 * 0.38 + flow * 0.25 + advect * 0.8 + drift * 0.8;
  vec3 p = vec3(cloudXY, depthSeed + zWave);
  float cam = 2.75;
  float persp = cam / (cam - p.z);
  persp = mix(1.0, persp, 0.22);
  vec2 ndc = p.xy * 1.77 * persp;
  vNdc = ndc;
  gl_Position = vec4(ndc, 0.0, 1.0);
  float depth01 = clamp((p.z + 1.3) / 2.6, 0.0, 1.0);
  float pulse = 0.985 + 0.03 * sin(uTime * 0.95 + z * 8.0 + rndB * 6.283);
  float vis = on;
  gl_PointSize = mix(5.8, 15.8, depth01) * pulse * vis;
  vec3 deepBlue = vec3(0.02, 0.16, 0.74);
  vec3 lightBlue = vec3(0.11, 0.48, 0.98);
  vec3 onCol = mix(deepBlue, lightBlue, 0.22 + 0.78*depth01) * (0.94 + 0.52*depth01);
  vCol = vec4(onCol, 0.94 * on);
  vGlow = (1.08 * on) * (0.84 + 0.42*depth01);
}`;
    const fsWebgl1 = `
precision highp float;
varying vec4 vCol;
varying float vGlow;
varying vec2 vNdc;
void main(){
  vec2 uv = gl_PointCoord*2.0 - 1.0;
  float d = dot(uv,uv);
  float core = smoothstep(1.0, 0.28, d);
  float rim = smoothstep(1.0, 0.86, d);
  float a = core * rim * vCol.a;
  gl_FragColor = vec4(vCol.rgb * (0.92 + 0.08 * core) * vGlow, a);
}`;
    const vs = glKind === "webgl2" ? vsWebgl2 : vsWebgl1
    const fs = glKind === "webgl2" ? fsWebgl2 : fsWebgl1
    function compile(type, src){
      const s = gl.createShader(type)
      gl.shaderSource(s, src)
      gl.compileShader(s)
      if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || "shader")
      return s
    }
    const prog = gl.createProgram()
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs))
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs))
    gl.linkProgram(prog)
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || "link")

    const pad = 16
    const drawW = bgCanvas.width - pad * 2
    const drawH = bgCanvas.height - pad * 2
    const cellW = drawW / GRID
    const cellH = drawH / GRID
    const N = FRAME_BITS
    const seeds = new Float32Array(N * 4)
    let si = 0
    for(let gy=0; gy<GRID; gy++){
      for(let gx=0; gx<GRID; gx++){
        const gridIdx = gy * GRID + gx
        if(!CARRIER_MASK[gridIdx]) continue
        const nx = (gx / (GRID - 1)) * 2 - 1
        const ny = (gy / (GRID - 1)) * 2 - 1
        const rr = nx * nx + ny * ny
        const z = Math.sqrt(Math.max(0, 1.0 - rr))
        seeds[si*4 + 0] = pad + (gx + 0.5) * cellW
        seeds[si*4 + 1] = pad + (gy + 0.5) * cellH
        seeds[si*4 + 2] = z
        seeds[si*4 + 3] = 0
        si++
      }
    }
    const vbo = gl.createBuffer()
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo)
    gl.bufferData(gl.ARRAY_BUFFER, seeds, gl.DYNAMIC_DRAW)

    gl.enable(gl.BLEND)
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA)

    const attrLoc = glKind === "webgl2" ? 0 : gl.getAttribLocation(prog, "aSeed")
    if(attrLoc < 0) throw new Error("attrib aSeed not found")
    return { prog, vbo, N, seeds, attrLoc, lastBits: "" }
  }catch(e){
    setStatus(`WebGL init failed: ${e.message}`)
    return null
  }
}

function setGalaxyFrameBits(bits){
  if(!gl || !galaxy || !bits) return
  if(galaxy.lastBits === bits) return
  const n = Math.min(galaxy.N, bits.length)
  for(let i=0;i<n;i++){
    galaxy.seeds[i*4 + 3] = bits[i] === "1" ? 1 : 0
  }
  for(let i=n;i<galaxy.N;i++){
    galaxy.seeds[i*4 + 3] = 0
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, galaxy.vbo)
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, galaxy.seeds)
  galaxy.lastBits = bits
}

function renderGalaxy(t){
  if(!gl) return
  if(!galaxy) galaxy = initGalaxy()
  if(!galaxy) return
  gl.viewport(0,0,bgCanvas.width,bgCanvas.height)
  gl.clearColor(1,1,1,1)
  gl.clear(gl.COLOR_BUFFER_BIT)
  gl.useProgram(galaxy.prog)
  gl.bindBuffer(gl.ARRAY_BUFFER, galaxy.vbo)
  gl.enableVertexAttribArray(galaxy.attrLoc)
  gl.vertexAttribPointer(galaxy.attrLoc, 4, gl.FLOAT, false, 0, 0)
  gl.uniform1f(gl.getUniformLocation(galaxy.prog,"uTime"), t)
  gl.uniform2f(gl.getUniformLocation(galaxy.prog,"uCanvas"), bgCanvas.width, bgCanvas.height)
  gl.drawArrays(gl.POINTS, 0, galaxy.N)
}

class FountainTx{
  constructor(fileBytes, meta){
    this.meta = meta
    this.fileBytes = fileBytes
    this.fileId = (crypto && crypto.getRandomValues) ? crypto.getRandomValues(new Uint32Array(1))[0]>>>0 : ((Math.random()*2**32)>>>0)
    // Conservative payload budget so one full droplet packet fits each frame.
    // With lower point density we intentionally reduce throughput for robustness.
    const maxPayload = Math.floor((FRAME_BITS - SYNC.length - TOTAL_CHUNKS_BITS * TOTAL_CHUNKS_REPEATS) / 8) - 30
    // Keep payload smaller than max to increase CRC pass probability on noisy channels.
    this.chunkSize = Math.min(128, Math.max(96, maxPayload | 0))
    this.K = Math.ceil(fileBytes.length / this.chunkSize)
    this.chunks = new Array(this.K)
    for(let i=0;i<this.K;i++){
      const start = i*this.chunkSize
      const end = Math.min(fileBytes.length, start+this.chunkSize)
      const c = new Uint8Array(this.chunkSize)
      c.set(fileBytes.slice(start,end))
      this.chunks[i]=c
    }
    this.seq = 0
  }

  _rng(seed){
    let x = seed >>> 0
    return () => {
      x ^= (x << 13) >>> 0
      x ^= (x >>> 17) >>> 0
      x ^= (x << 5) >>> 0
      return x >>> 0
    }
  }

  _degree(rng){
    const r = (rng()>>>0) / 0xFFFFFFFF
    // Robust-first profile: favor degree-1 so each valid droplet is likely to decode a chunk.
    if(r < 0.68) return 1
    if(r < 0.88) return 2
    if(r < 0.97) return 3
    return Math.min(this.K, 4)
  }

  _crc32(u8){
    return crc32(u8)
  }

  _buildMetaPacket(){
    const name = (this.meta.name || "recovered_file").slice(0, 80)
    const type = (this.meta.type || "application/octet-stream").slice(0, 60)
    const nameB = asciiToBytes(name)
    const typeB = asciiToBytes(type)
    const header = concatBytes([
      asciiToBytes(MAGIC),
      new Uint8Array([1]), // kind meta
      u32ToBytesLE(this.fileId),
      u32ToBytesLE(this.fileBytes.length>>>0),
      u16ToBytesLE(this.chunkSize),
      u32ToBytesLE(this.K>>>0),
      u16ToBytesLE(nameB.length),
      u16ToBytesLE(typeB.length),
      nameB,
      typeB
    ])
    return concatBytes([header, u32ToBytesLE(this._crc32(header))])
  }

  _buildDropletPacket(){
    const seed = (this.seq * 2654435761) >>> 0
    const rng = this._rng(seed ^ this.fileId)
    const d = this._degree(rng)
    const chosen = new Set()
    while(chosen.size < d){
      chosen.add((rng()>>>0) % this.K)
    }
    const payload = new Uint8Array(this.chunkSize)
    for(const idx of chosen){
      const c = this.chunks[idx]
      for(let i=0;i<payload.length;i++) payload[i] ^= c[i]
    }
    const header = concatBytes([
      asciiToBytes(MAGIC),
      new Uint8Array([2]), // kind droplet
      u32ToBytesLE(this.fileId),
      u32ToBytesLE(seed),
      new Uint8Array([d & 255]),
      u32ToBytesLE(this.K>>>0),
      u16ToBytesLE(this.chunkSize),
      u16ToBytesLE(payload.length),
      payload
    ])
    return concatBytes([header, u32ToBytesLE(this._crc32(header))])
  }

  nextFrameBits(){
    // No dedicated meta packets: every transmitted frame carries data droplets.
    // Total chunk count (K) is embedded in every frame via totalRep bits below.
    const pkt = this._buildDropletPacket()
    this.seq++
    const payloadBits = bytesToBits(pkt)
    const needed = FRAME_BITS - SYNC.length - TOTAL_CHUNKS_BITS * TOTAL_CHUNKS_REPEATS
    // Fill to full frame by repeating payload (not zero-pad) so the whole circle shows dots
    let clipped = payloadBits
    while (clipped.length < needed) clipped += payloadBits.slice(0, needed - clipped.length)
    clipped = clipped.slice(0, needed)
    const totalBits = (this.K >>> 0).toString(2).padStart(TOTAL_CHUNKS_BITS, "0")
    const totalRep = totalBits.repeat(TOTAL_CHUNKS_REPEATS)
    return (SYNC + totalRep + clipped).padEnd(FRAME_BITS, "0").slice(0, FRAME_BITS)
  }
}

class FountainRx{
  constructor(){
    this.reset()
  }
  reset(){
    this.fileId = null
    this.totalSize = null
    this.chunkSize = null
    this.K = null
    this.meta = null
    this.chunks = null
    this.known = null
    this.waitingByChunk = null
    this.droplets = []
    this.solved = 0
  }
  ingestPacket(pkt){
    if(pkt.length < 9) return
    const magic = String.fromCharCode(pkt[0],pkt[1],pkt[2],pkt[3])
    if(magic !== MAGIC) return
    const kind = pkt[4]
    if(kind === 1){
      let off = 5
      if(pkt.length < off + 4+4+2+4+2+2) return
      const fileId = bytesToU32LE(pkt, off); off+=4
      const totalSize = bytesToU32LE(pkt, off); off+=4
      const chunkSize = bytesToU16LE(pkt, off); off+=2
      const K = bytesToU32LE(pkt, off); off+=4
      const nameLen = bytesToU16LE(pkt, off); off+=2
      const typeLen = bytesToU16LE(pkt, off); off+=2
      const pktLen = off + nameLen + typeLen + 4
      if(pkt.length < pktLen) return
      pkt = pkt.slice(0, pktLen)
      const name = String.fromCharCode(...pkt.slice(off, off+nameLen)); off += nameLen
      const type = String.fromCharCode(...pkt.slice(off, off+typeLen)); off += typeLen
      const crc = bytesToU32LE(pkt, off); off += 4
      const calc = crc32(pkt.slice(0, pkt.length-4))
      if(calc !== crc) return
      if(this.fileId == null) this.fileId = fileId
      if(this.fileId !== fileId) return
      this.totalSize = totalSize
      this.chunkSize = chunkSize
      this.K = K
      this.meta = { name, type }
      if(!this.chunks){
        this.chunks = new Array(K)
        this.known = new Array(K).fill(false)
        this.waitingByChunk = new Array(K)
        for(let i=0;i<K;i++) this.waitingByChunk[i] = []
      }
      return
    }
    if(kind === 2){
      let off = 5
      if(pkt.length < off + 4+4+1+4+2+2) return
      const fileId = bytesToU32LE(pkt, off); off+=4
      const seed = bytesToU32LE(pkt, off); off+=4
      const d = pkt[off]; off+=1
      const K = bytesToU32LE(pkt, off); off+=4
      const chunkSize = bytesToU16LE(pkt, off); off+=2
      const payloadLen = bytesToU16LE(pkt, off); off+=2
      const pktLen = off + payloadLen + 4
      if(pkt.length < pktLen) return
      pkt = pkt.slice(0, pktLen)
      const payload = pkt.slice(off, off+payloadLen); off += payloadLen
      const crc = bytesToU32LE(pkt, off); off+=4
      const calc = crc32(pkt.slice(0, pkt.length-4))
      if(calc !== crc) return

      if(this.fileId == null) this.fileId = fileId
      if(this.fileId !== fileId) return
      if(this.K == null) this.K = K
      if(this.chunkSize == null) this.chunkSize = chunkSize
      if(!this.chunks && this.K != null){
        this.chunks = new Array(this.K)
        this.known = new Array(this.K).fill(false)
        this.waitingByChunk = new Array(this.K)
        for(let i=0;i<this.K;i++) this.waitingByChunk[i] = []
      }
      if(!this.chunks) return
      if(K !== this.K || chunkSize !== this.chunkSize) return

      // regenerate indices from seed
      let x = (seed ^ this.fileId) >>> 0
      const rng = () => {
        x ^= (x << 13) >>> 0
        x ^= (x >>> 17) >>> 0
        x ^= (x << 5) >>> 0
        return x >>> 0
      }
      const chosen = new Set()
      while(chosen.size < Math.max(1, Math.min(this.K, d))){
        chosen.add((rng()>>>0) % this.K)
      }
      const indices = Array.from(chosen)

      const reduced = new Uint8Array(payload)
      const unknown = []
      for(const idx of indices){
        if(this.known[idx]){
          const c = this.chunks[idx]
          for(let i=0;i<reduced.length;i++) reduced[i] ^= c[i]
        }else{
          unknown.push(idx)
        }
      }
      if(unknown.length === 0) return
      const di = this.droplets.length
      this.droplets.push({ unknown: unknown.slice(), payload: reduced })
      for(const idx of unknown) this.waitingByChunk[idx].push(di)
      if(unknown.length === 1) this._solve(unknown[0], reduced)
    }
  }
  _solve(idx, bytes){
    if(this.known[idx]) return
    const c = new Uint8Array(this.chunkSize)
    c.set(bytes.slice(0, this.chunkSize))
    this.chunks[idx] = c
    this.known[idx] = true
    this.solved++

    const waiting = this.waitingByChunk[idx]
    for(const di of waiting){
      const d = this.droplets[di]
      if(!d) continue
      const pos = d.unknown.indexOf(idx)
      if(pos === -1) continue
      for(let i=0;i<d.payload.length;i++) d.payload[i] ^= c[i]
      d.unknown.splice(pos, 1)
      if(d.unknown.length === 1) this._solve(d.unknown[0], d.payload)
    }
    this.waitingByChunk[idx] = []
  }
  progress(){
    if(!this.K) return { have: 0, need: 0 }
    return { have: this.solved, need: this.K }
  }
  isComplete(){
    return this.K != null && this.chunkSize != null && this.solved >= this.K
  }
  buildFile(){
    if(!this.isComplete()) return null
    const merged = new Uint8Array(this.K * this.chunkSize)
    for(let i=0;i<this.K;i++){
      merged.set(this.chunks[i] || new Uint8Array(this.chunkSize), i*this.chunkSize)
    }
    const finalSize = (this.totalSize != null) ? this.totalSize : (this.K * this.chunkSize)
    return merged.slice(0, finalSize)
  }
}

function detectMarkers(img, w, h, dbg){
  function bestInRegion(x0, x1, y0, y1, scoreFn){
    let best = { s: -1, x: 0, y: 0 }
    const sx0 = Math.max(0, x0|0), sx1 = Math.min(w, x1|0)
    const sy0 = Math.max(0, y0|0), sy1 = Math.min(h, y1|0)
    for(let y=sy0; y<sy1; y++){
      for(let x=sx0; x<sx1; x++){
        const i=(y*w+x)*4
        const r=img[i], g=img[i+1], b=img[i+2]
        const s = scoreFn(r,g,b)
        if(s > best.s) best = { s, x, y }
      }
    }
    // Use a weighted centroid near the top score; this is much stabler than a single max pixel.
    const cut = best.s * 0.86
    let wx = 0, wy = 0, ws = 0
    for(let y=sy0; y<sy1; y++){
      for(let x=sx0; x<sx1; x++){
        const i=(y*w+x)*4
        const r=img[i], g=img[i+1], b=img[i+2]
        const s = scoreFn(r,g,b)
        if(s < cut) continue
        const wv = 1 + (s - cut)
        wx += x * wv
        wy += y * wv
        ws += wv
      }
    }
    if(ws > 0){
      best.x = Math.round(wx / ws)
      best.y = Math.round(wy / ws)
    }
    return best
  }

  // Finders are color-coded by corner; search each color in its expected quadrant.
  const mx = (w * 0.5) | 0
  const my = (h * 0.5) | 0
  // Use channel-dominance scoring so white/gray background does not win.
  const cyan = bestInRegion(0,  mx, 0,  my, (r,g,b)=> Math.min(g, b) - r)
  const mag  = bestInRegion(mx, w,  0,  my, (r,g,b)=> Math.min(r, b) - g)
  const yel  = bestInRegion(0,  mx, my, h,  (r,g,b)=> Math.min(r, g) - b)
  const grn  = bestInRegion(mx, w,  my, h,  (r,g,b)=> g - Math.max(r, b))
  if(dbg){
    dbg.marker = {
      ok: false,
      reason: "scores",
      cyan: Math.round(cyan.s),
      mag: Math.round(mag.s),
      yel: Math.round(yel.s),
      grn: Math.round(grn.s)
    }
  }

  // Keep gates permissive so we lock quickly on real finder colors under varied exposure.
  if(cyan.s < 14 || mag.s < 14 || yel.s < 14 || grn.s < 11){
    if(dbg && dbg.marker) dbg.marker.reason = "low-color-confidence"
    return null
  }
  const tl = cyan, tr = mag, bl = yel, br = grn
  if(!(tl.x < tr.x && bl.x < br.x && tl.y < bl.y && tr.y < br.y)){
    if(dbg && dbg.marker) dbg.marker.reason = "corner-order-invalid"
    return null
  }
  const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y)
  const minSpan = Math.min(d(tl, tr), d(bl, br), d(tl, bl), d(tr, br))
  if(minSpan < Math.min(w, h) * 0.18){
    if(dbg && dbg.marker){
      dbg.marker.reason = "marker-span-too-small"
      dbg.marker.minSpan = fmt2(minSpan)
    }
    return null
  }
  if(dbg && dbg.marker){
    dbg.marker.ok = true
    dbg.marker.reason = "ok"
    dbg.marker.tl = { x: tl.x, y: tl.y }
    dbg.marker.tr = { x: tr.x, y: tr.y }
    dbg.marker.bl = { x: bl.x, y: bl.y }
    dbg.marker.br = { x: br.x, y: br.y }
    dbg.marker.minSpan = fmt2(minSpan)
  }
  return { tl, tr, bl, br }
}

function computeHomography(src, dst){
  const A=[], b=[]
  for(let i=0;i<4;i++){
    const x=src[i].x, y=src[i].y, u=dst[i].x, v=dst[i].y
    A.push([x,y,1, 0,0,0, -u*x, -u*y]); b.push(u)
    A.push([0,0,0, x,y,1, -v*x, -v*y]); b.push(v)
  }
  const M = new Array(8)
  for(let i=0;i<8;i++){ M[i]=A[i].slice(); M[i].push(b[i]) }
  for(let col=0; col<8; col++){
    let pivot=col
    for(let r=col+1;r<8;r++) if(Math.abs(M[r][col])>Math.abs(M[pivot][col])) pivot=r
    const tmp=M[col]; M[col]=M[pivot]; M[pivot]=tmp
    const div=M[col][col] || 1e-12
    for(let c=col;c<9;c++) M[col][c]/=div
    for(let r=0;r<8;r++){
      if(r===col) continue
      const f=M[r][col]
      for(let c=col;c<9;c++) M[r][c]-=f*M[col][c]
    }
  }
  const h=new Array(9).fill(0)
  for(let i=0;i<8;i++) h[i]=M[i][8]
  h[8]=1
  return h
}

function invertHomography(H){
  const a=H[0],b=H[1],c=H[2], d=H[3],e=H[4],f=H[5], g=H[6],h=H[7],i=H[8]
  const A=e*i-f*h, B=f*g-d*i, C=d*h-e*g
  const D=c*h-b*i, E=a*i-c*g, F=b*g-a*h
  const G=b*f-c*e, Hh=c*d-a*f, I=a*e-b*d
  const det=a*A + b*B + c*C
  if(Math.abs(det)<1e-12) return null
  const inv=1/det
  return [A*inv, D*inv, G*inv, B*inv, E*inv, Hh*inv, C*inv, F*inv, I*inv]
}

function mapPoint(H, x, y){
  const den = H[6]*x + H[7]*y + H[8]
  return { x: (H[0]*x + H[1]*y + H[2]) / den, y: (H[3]*x + H[4]*y + H[5]) / den }
}

function decodePacketFromFrame(img, w, h, corners, dbg){
  if(dbg){
    dbg.packet = {
      ok: false,
      reason: "init",
      minL: NaN,
      maxL: NaN,
      thr: NaN,
      syncMatch: 0,
      syncMatchInv: 0,
      syncUsed: "none",
      byteLen: 0,
      inset: 0,
      order: -1,
      scale: 1,
      bitShift: 0,
      byteOffset: 0
    }
  }
  const base = [corners.tl, corners.tr, corners.br, corners.bl].map(p=>({x:p.x,y:p.y}))
  const orders = [
    [0,1,2,3], [1,2,3,0], [2,3,0,1], [3,0,1,2],
    [0,3,2,1], [3,2,1,0], [2,1,0,3], [1,0,3,2]
  ]
  const insetCandidates = [0.50, 0.56, 0.62, 0.66, 0.70, 0.72, 0.74, 0.78, 0.82]
  const scaleCandidates = [0.45, 0.55, 0.65, 0.75, 0.85, 1.0]
  const dst = [{x:0,y:0},{x:1,y:0},{x:1,y:1},{x:0,y:1}]

  function evaluatePose(orderIdx, inset, carrierScale){
    const ord = orders[orderIdx]
    const raw = [base[ord[0]], base[ord[1]], base[ord[2]], base[ord[3]]]
    const cx = (raw[0].x+raw[1].x+raw[2].x+raw[3].x)/4
    const cy = (raw[0].y+raw[1].y+raw[2].y+raw[3].y)/4
    const src = raw.map(p=>({ x: cx + (p.x - cx) * inset, y: cy + (p.y - cy) * inset }))
    const H = computeHomography(src, dst)
    const inv = invertHomography(H)
    if(!inv) return { match: -1, reason: "homography-invert-failed", inset, orderIdx }

    let minMax=1e9, maxMax=-1e9
    let minMin=1e9, maxMin=-1e9
    let minBlueMax=1e9, maxBlueMax=-1e9
    let minBlueMin=1e9, maxBlueMin=-1e9
    let minInkMax=1e9, maxInkMax=-1e9
    let minInkMin=1e9, maxInkMin=-1e9
    const lumMax = new Float32Array(FRAME_BITS)
    const lumMin = new Float32Array(FRAME_BITS)
    const blueMax = new Float32Array(FRAME_BITS)
    const blueMin = new Float32Array(FRAME_BITS)
    const inkMax = new Float32Array(FRAME_BITS)
    const inkMin = new Float32Array(FRAME_BITS)
    let idx=0
    for(let y=0;y<GRID;y++){
      for(let x=0;x<GRID;x++){
        const gridIdx = y*GRID + x
        if(!CARRIER_MASK[gridIdx]) continue
        const u0=(x+0.5)/GRID, v0=(y+0.5)/GRID
        const u=0.5 + (u0 - 0.5) * carrierScale
        const v=0.5 + (v0 - 0.5) * carrierScale
        const p=mapPoint(inv,u,v)
        const px=Math.max(1,Math.min(w-2,Math.floor(p.x)))
        const py=Math.max(1,Math.min(h-2,Math.floor(p.y)))
        let Lmax = 0
        let Lmin = 1
        let Bmax = 0
        let Bmin = 1
        let Imax = 0
        let Imin = 1
        for(let oy=-1; oy<=1; oy++){
          for(let ox=-1; ox<=1; ox++){
            const sx = px + ox
            const sy = py + oy
            const ii=(sy*w+sx)*4
            const r=img[ii], g=img[ii+1], b=img[ii+2]
            const l=(0.2126*r + 0.7152*g + 0.0722*b)/255
            // Blue-emphasis metric in [0..1]. Robust for dark-blue ON dots on white.
            const bl = 0.5 + 0.5 * ((b - 0.5 * (r + g)) / 255)
            const ink = 1 - l
            if(l > Lmax) Lmax = l
            if(l < Lmin) Lmin = l
            if(bl > Bmax) Bmax = bl
            if(bl < Bmin) Bmin = bl
            if(ink > Imax) Imax = ink
            if(ink < Imin) Imin = ink
          }
        }
        lumMax[idx] = Lmax
        lumMin[idx] = Lmin
        blueMax[idx] = Bmax
        blueMin[idx] = Bmin
        inkMax[idx] = Imax
        inkMin[idx] = Imin
        idx++
        if(Lmax<minMax) minMax=Lmax
        if(Lmax>maxMax) maxMax=Lmax
        if(Lmin<minMin) minMin=Lmin
        if(Lmin>maxMin) maxMin=Lmin
        if(Bmax<minBlueMax) minBlueMax=Bmax
        if(Bmax>maxBlueMax) maxBlueMax=Bmax
        if(Bmin<minBlueMin) minBlueMin=Bmin
        if(Bmin>maxBlueMin) maxBlueMin=Bmin
        if(Imax<minInkMax) minInkMax=Imax
        if(Imax>maxInkMax) maxInkMax=Imax
        if(Imin<minInkMin) minInkMin=Imin
        if(Imin>maxInkMin) maxInkMin=Imin
      }
    }
    const spanMax = maxMax - minMax
    const spanMin = maxMin - minMin
    const spanBlueMax = maxBlueMax - minBlueMax
    const spanBlueMin = maxBlueMin - minBlueMin
    const spanInkMax = maxInkMax - minInkMax
    const spanInkMin = maxInkMin - minInkMin
    if(spanMax < 0.02 && spanMin < 0.02 && spanBlueMax < 0.02 && spanBlueMin < 0.02 && spanInkMax < 0.02 && spanInkMin < 0.02){
      return {
        match: -1,
        reason: "low-contrast",
        min: Math.min(minMax, minMin, minBlueMax, minBlueMin, minInkMax, minInkMin),
        max: Math.max(maxMax, maxMin, maxBlueMax, maxBlueMin, maxInkMax, maxInkMin),
        inset,
        orderIdx
      }
    }

    function scoreSignal(sig){
      const bins = 64
      const hist = new Uint32Array(bins)
      for(let i=0;i<sig.length;i++){
        const b = Math.max(0, Math.min(bins-1, (sig[i] * bins) | 0))
        hist[b]++
      }
      const total = sig.length
      let sum = 0
      for(let i=0;i<bins;i++) sum += i * hist[i]
      let sumB = 0
      let wB = 0
      let varMax = -1
      let thrBin = (bins/2)|0
      for(let i=0;i<bins;i++){
        wB += hist[i]
        if(wB === 0) continue
        const wF = total - wB
        if(wF === 0) break
        sumB += i * hist[i]
        const mB = sumB / wB
        const mF = (sum - sumB) / wF
        const v = wB * wF * (mB - mF) * (mB - mF)
        if(v > varMax){ varMax = v; thrBin = i }
      }
      const otsuThr = (thrBin + 0.5) / bins
      const candidates = [-0.16,-0.12,-0.08,-0.04,0,0.04,0.08,0.12,0.16].map(d=>Math.max(0.02, Math.min(0.98, otsuThr + d)))
      let best = { match: -1, bits: "", raw: 0, inv: 0, useInv: false, thr: otsuThr }
      for(const thr of candidates){
        let bits=""
        for(let i=0;i<sig.length;i++) bits += (sig[i] > thr) ? "1":"0"
        let rawScore = 0
        for(let i=0;i<SYNC.length;i++) if(bits[i] === SYNC[i]) rawScore++
        const invScore = SYNC.length - rawScore
        const match = Math.max(rawScore, invScore)
        if(match > best.match) best = { match, bits, raw: rawScore, inv: invScore, useInv: invScore > rawScore, thr }
      }
      let bits = best.bits
      if(best.useInv){
        let invBits = ""
        for(let i=0;i<bits.length;i++) invBits += bits[i] === "1" ? "0" : "1"
        bits = invBits
      }
      return { best, bits, used: (best.useInv ? best.inv : best.raw) }
    }

    const maxPath = scoreSignal(lumMax)
    const minPath = scoreSignal(lumMin)
    const blueMaxPath = scoreSignal(blueMax)
    const blueMinPath = scoreSignal(blueMin)
    const inkMaxPath = scoreSignal(inkMax)
    const inkMinPath = scoreSignal(inkMin)
    const candidates = [
      { ...maxPath, mode: "luma-max", min:minMax, max:maxMax },
      { ...minPath, mode: "luma-min", min:minMin, max:maxMin },
      { ...blueMaxPath, mode: "blue-max", min:minBlueMax, max:maxBlueMax },
      { ...blueMinPath, mode: "blue-min", min:minBlueMin, max:maxBlueMin },
      { ...inkMaxPath, mode: "ink-max", min:minInkMax, max:maxInkMax },
      { ...inkMinPath, mode: "ink-min", min:minInkMin, max:maxInkMin }
    ]
    let chosen = candidates[0]
    for(let i=1;i<candidates.length;i++){
      if(candidates[i].used > chosen.used) chosen = candidates[i]
    }
    const used = chosen.used
    return {
      match: used,
      reason: used >= 40 ? "ok" : "sync-too-low",
      bits: chosen.bits,
      min: chosen.min,
      max: chosen.max,
      thr: chosen.best.thr,
      syncMatch: used,
      syncMatchInv: chosen.best.inv,
      syncUsed: chosen.best.useInv ? "inverted" : "normal",
      sampleMode: chosen.mode,
      inset,
      scale: carrierScale,
      orderIdx
    }
  }

  let bestPose = null
  for(let oi=0; oi<orders.length; oi++){
    for(const inset of insetCandidates){
      for(const scale of scaleCandidates){
        const pose = evaluatePose(oi, inset, scale)
        if(!bestPose || pose.match > bestPose.match) bestPose = pose
      }
    }
  }

  if(!bestPose){
    if(dbg && dbg.packet) dbg.packet.reason = "no-pose"
    return null
  }
  if(dbg && dbg.packet){
    dbg.packet.minL = bestPose.min
    dbg.packet.maxL = bestPose.max
    dbg.packet.thr = bestPose.thr
    dbg.packet.syncMatch = bestPose.syncMatch || 0
    dbg.packet.syncMatchInv = bestPose.syncMatchInv || 0
    dbg.packet.syncUsed = bestPose.syncUsed || "none"
    dbg.packet.sampleMode = bestPose.sampleMode || "?"
    dbg.packet.inset = bestPose.inset
    dbg.packet.scale = bestPose.scale != null ? bestPose.scale : 1
    dbg.packet.order = bestPose.orderIdx
  }
  const totalStart = SYNC.length
  const totalBlockLen = TOTAL_CHUNKS_BITS * TOTAL_CHUNKS_REPEATS
  let totalChunks = 0
  if(bestPose.bits && bestPose.bits.length >= totalStart + totalBlockLen){
    const totalRepBits = bestPose.bits.slice(totalStart, totalStart + totalBlockLen)
    let totalBits = ""
    for(let i=0;i<TOTAL_CHUNKS_BITS;i++){
      let ones = 0
      for(let r=0;r<TOTAL_CHUNKS_REPEATS;r++){
        const b = totalRepBits[i + r*TOTAL_CHUNKS_BITS]
        if(b === "1") ones++
      }
      totalBits += (ones >= 2) ? "1" : "0"
    }
    totalChunks = parseInt(totalBits, 2) >>> 0
  }
  if(bestPose.match < 40){
    if(dbg && dbg.packet) dbg.packet.reason = bestPose.reason || "sync-too-low"
    return { pkt: null, totalChunks }
  }
  const payloadBits = bestPose.bits.slice(totalStart + totalBlockLen)
  function tryPacketFromShift(shift){
    const bytes = bitsToBytes(payloadBits.slice(shift))
    if(bytes.length < 9) return null
    const m0 = MAGIC.charCodeAt(0), m1 = MAGIC.charCodeAt(1), m2 = MAGIC.charCodeAt(2), m3 = MAGIC.charCodeAt(3)
    for(let start=0; start<=bytes.length-9; start++){
      if(bytes[start] !== m0 || bytes[start+1] !== m1 || bytes[start+2] !== m2 || bytes[start+3] !== m3) continue
      const kind = bytes[start + 4]
      if(kind === 2){
        let off = start + 5
        if(bytes.length < off + 4 + 4 + 1 + 4 + 2 + 2) continue
        off += 4 + 4 + 1 + 4 + 2
        const payloadLen = bytesToU16LE(bytes, off); off += 2
        const pktLen = (off - start) + payloadLen + 4
        if(start + pktLen > bytes.length) continue
        const pkt = bytes.slice(start, start + pktLen)
        const crc = bytesToU32LE(pkt, pktLen - 4)
        const calc = crc32(pkt.slice(0, pktLen - 4))
        if(calc !== crc) continue
        return { pkt, shift, start }
      }
      if(kind === 1){
        let off = start + 5
        if(bytes.length < off + 4 + 4 + 2 + 4 + 2 + 2) continue
        off += 4 + 4 + 2 + 4
        const nameLen = bytesToU16LE(bytes, off); off += 2
        const typeLen = bytesToU16LE(bytes, off); off += 2
        const pktLen = (off - start) + nameLen + typeLen + 4
        if(start + pktLen > bytes.length) continue
        const pkt = bytes.slice(start, start + pktLen)
        const crc = bytesToU32LE(pkt, pktLen - 4)
        const calc = crc32(pkt.slice(0, pktLen - 4))
        if(calc !== crc) continue
        return { pkt, shift, start }
      }
    }
    return null
  }
  let aligned = null
  for(let shift=0; shift<8; shift++){
    aligned = tryPacketFromShift(shift)
    if(aligned) break
  }
  const out = aligned ? aligned.pkt : bitsToBytes(payloadBits)
  if(dbg && dbg.packet){
    dbg.packet.ok = true
    dbg.packet.reason = "ok"
    dbg.packet.byteLen = out.length
    dbg.packet.bitShift = aligned ? aligned.shift : 0
    dbg.packet.byteOffset = aligned ? aligned.start : 0
  }
  return { pkt: out, totalChunks }
}

function buildFramesFromPackets(){
  // Frame header: frameIndex (32) + totalFrames (32) + sessionNonce (32) + reserved (32)
  // Remaining bits carry one packet (or part of it). We keep packet <= payloadBitsPerFrame.
  frames = []
  txPacketCursor = 0
  txSessionNonce = (txSessionNonce + 1) >>> 0

  const headerBits = 128
  txPayloadBitsPerFrame = FRAME_BITS - headerBits
  if(txPayloadBitsPerFrame <= 0) txPayloadBitsPerFrame = 1

  // Packets are pre-sized to fit in one frame; totalFrames is virtual for progress only.
  txTotalFrames = txPackets.length

  for(let i=0;i<txPackets.length;i++){
    const pktBits = bytesToBits(txPackets[i])
    const payloadBits = pktBits.padEnd(txPayloadBitsPerFrame, "0").slice(0, txPayloadBitsPerFrame)
    const indexBits = i.toString(2).padStart(32,"0")
    const totalBits = txTotalFrames.toString(2).padStart(32,"0")
    const nonceBits = txSessionNonce.toString(2).padStart(32,"0")
    const reservedBits = "0".repeat(32)
    const frame = indexBits + totalBits + nonceBits + reservedBits + payloadBits
    // repetition for majority vote on the receiver
    for(let r=0;r<3;r++) frames.push(frame)
  }
}

function buildTxPackets(fileBytes, meta){
  txPackets = []

  const chunkSize = 240 // bytes; chosen to fit into one frame w/ headers
  const totalChunks = Math.ceil(fileBytes.length / chunkSize)

  // Meta packet: sent multiple times for robustness
  const metaPkt = buildMetaPacket(meta, fileBytes.length, chunkSize, totalChunks)
  for(let i=0;i<12;i++) txPackets.push(metaPkt)

  // Data packets
  const dataChunks = []
  for(let i=0;i<totalChunks;i++){
    const start = i * chunkSize
    const end = Math.min(fileBytes.length, start + chunkSize)
    const chunk = fileBytes.slice(start, end)
    const pkt = buildDataPacket(i, totalChunks, chunk, chunkSize)
    dataChunks.push({ i, chunk, pkt })
    txPackets.push(pkt)
  }

  // Simple XOR parity FEC per group (erasure correction for 1 missing in group)
  // For every group of G data chunks, add:
  // - parityAll: XOR of all padded chunks
  // - parityEO: XOR of even-indexed chunks (within group) (helps in some drop patterns)
  const G = 10
  for(let g=0; g<totalChunks; g+=G){
    const group = dataChunks.slice(g, g+G)
    if(group.length < 2) continue
    const parityAll = xorChunks(group.map(x=>x.chunk), chunkSize)
    const parityEO  = xorChunks(group.filter((_,idx)=>idx%2===0).map(x=>x.chunk), chunkSize)
    txPackets.push(buildParityPacket(g, G, totalChunks, 0, parityAll, chunkSize))
    txPackets.push(buildParityPacket(g, G, totalChunks, 1, parityEO, chunkSize))
  }

  // Randomize order for continuous broadcast; we reshuffle each full loop.
  shuffleInPlace(txPackets)
}

function initParticles(){
  // Precompute fixed screen-space carrier microdot layout.
  particles = []
  const pad = 16
  const w = canvas.width - pad*2
  const h = canvas.height - pad*2
  const cellW = w / GRID
  const cellH = h / GRID

  const radiusSq = CARRIER_RADIUS_SQ  // keep tx carrier and decoder mask identical
  for(let gy=0; gy<GRID; gy++){
    for(let gx=0; gx<GRID; gx++){
      const nx = (gx / (GRID - 1)) * 2 - 1
      const ny = (gy / (GRID - 1)) * 2 - 1
      const rr = nx*nx + ny*ny
      const inside = rr <= radiusSq
      const z = inside ? Math.sqrt(Math.max(0, 1.0 - rr)) : 0
      particles.push({
        gx, gy,
        x: pad + (gx + 0.5) * cellW,
        y: pad + (gy + 0.5) * cellH,
        inside,
        z
      })
    }
  }
}

function drawFinders(){
  const M = 38;
  const pad = 16;
  const w = canvas.width - pad*2, h = canvas.height - pad*2;
  const cellW = w / GRID, cellH = h / GRID;
  const centerX = pad + (GRID - 1) * 0.5 * cellW;
  const centerY = pad + (GRID - 1) * 0.5 * cellH;
  const radiusPx = Math.sqrt(CARRIER_RADIUS_SQ) * (GRID - 1) * 0.5 * cellW;
  const extraGap = 10; // push finders slightly farther from particle circle
  const inset = Math.round(centerX - radiusPx - M * 0.5 - extraGap);
  const x1 = inset, x2 = canvas.width - inset - M, y1 = inset, y2 = canvas.height - inset - M;
  const rr = M * 0.5
  function drawCorner(cx, cy, col){
    ctx.fillStyle = col
    ctx.beginPath()
    ctx.arc(cx, cy, rr, 0, Math.PI * 2)
    ctx.fill()
  }
  drawCorner(x1 + rr, y1 + rr, "rgba(0,210,230,0.96)")
  drawCorner(x2 + rr, y1 + rr, "rgba(235,70,220,0.96)")
  drawCorner(x1 + rr, y2 + rr, "rgba(235,220,40,0.96)")
  drawCorner(x2 + rr, y2 + rr, "rgba(40,205,75,0.96)")
}

const TX_FRAME_MS = 500  // show each data frame for 500ms (decoding window)
let txNextFrameAtMs = 0

function startTxLoop(){
  const runId = txRun
  txNextFrameAtMs = 0
  function loop(){
    if(runId !== txRun) return

    const nowMs = performance.now()
    // Freeze shader time: keep particle cloud look static for decodable frames.
    renderGalaxy(0.0)
    ctx.clearRect(0,0,canvas.width,canvas.height)

    drawFinders()

    if(txFountain){
      if(nowMs >= txNextFrameAtMs){
        frames[0] = txFountain.nextFrameBits()
        frameIndex = 0
        txNextFrameAtMs = nowMs + TX_FRAME_MS
        if(galaxy && frames.length) setGalaxyFrameBits(frames[frameIndex] || "")
      }
      if(galaxy && frames.length) setGalaxyFrameBits(frames[frameIndex] || "")
    }
    // WebGL unavailable fallback: keep transfer functional with 2D dots.
    if(!gl || !galaxy){
      ctx.globalCompositeOperation = "source-over"
      const frame = frames[frameIndex] || ""
      let bitIdx = 0
      for(let i=0;i<particles.length;i++){
        const p = particles[i]
        if(!p.inside) continue
        if(frame[bitIdx++] !== "1") continue
        const r = 1.25 + 1.7*p.z
        const a = 0.45 + 0.45*p.z
        ctx.fillStyle = `rgba(10,60,190,${a})`
        ctx.beginPath()
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2)
        ctx.fill()
      }
    }

    if(!txFountain){
      frameIndex=(frameIndex+1)%frames.length
      if(frameIndex === 0 && frames.length){
        shuffleInPlace(txPackets)
        buildFramesFromPackets()
      }
    }

    requestAnimationFrame(loop)
  }
  requestAnimationFrame(loop)
}

async function tuneDecoderCameraExposure(stream){
  try{
    const track = stream?.getVideoTracks?.()[0]
    if(!track || !track.getCapabilities || !track.applyConstraints) return
    const caps = track.getCapabilities()
    const adv = {}
    if(caps.exposureMode){
      const modes = Array.isArray(caps.exposureMode) ? caps.exposureMode : [caps.exposureMode]
      if(modes.includes("continuous")) adv.exposureMode = "continuous"
      else if(modes.includes("manual")) adv.exposureMode = "manual"
    }
    if(typeof caps.exposureCompensation?.min === "number" && typeof caps.exposureCompensation?.max === "number"){
      const target = Math.min(caps.exposureCompensation.max, Math.max(caps.exposureCompensation.min, 1.25))
      adv.exposureCompensation = target
    }
    if(typeof caps.brightness?.min === "number" && typeof caps.brightness?.max === "number"){
      const target = Math.min(caps.brightness.max, Math.max(caps.brightness.min, 0.7))
      adv.brightness = target
    }
    if(Object.keys(adv).length){
      await track.applyConstraints({ advanced: [adv] })
    }
  }catch(_){
    // Best-effort only; unsupported on many mobile browsers.
  }
}

function decodeLoop(){
  const dbg = { frameNo: (decodeLoop._frameNo = (decodeLoop._frameNo || 0) + 1) }
  const totalLabel = () => {
    if(decodeExpectedTotal != null && decodeExpectedTotal > 0 && decodeExpectedTotal <= 200000) return String(decodeExpectedTotal)
    if(rxFountain && rxFountain.K != null && rxFountain.K > 0 && rxFountain.K <= 200000) return String(rxFountain.K)
    if(decodeEstimatedTotal != null && decodeEstimatedTotal > 0) return "~" + String(decodeEstimatedTotal)
    return "?"
  }
  const vw = video.videoWidth || 0
  const vh = video.videoHeight || 0
  if(!vw || !vh){
    dbg.capture = { vw, vh, side: 0 }
    dbg.marker = { ok: false, reason: "video-not-ready", cyan: 0, mag: 0, yel: 0, grn: 0 }
    renderDecodeDebug(dbg)
    requestAnimationFrame(decodeLoop)
    return
  }

  // center-crop square for stability
  const side = Math.min(vw, vh)
  const sx = Math.floor((vw - side) / 2)
  const sy = Math.floor((vh - side) / 2)
  dbg.capture = { vw, vh, side }

  // small scan for marker detection
  const detSize = 280
  const scan = decodeLoop._scan || (decodeLoop._scan = document.createElement("canvas"))
  scan.width = detSize
  scan.height = detSize
  const sctx = decodeLoop._sctx || (decodeLoop._sctx = scan.getContext("2d", { willReadFrequently:true }))
  sctx.drawImage(video, sx, sy, side, side, 0,0, detSize, detSize)
  const imgSmall = sctx.getImageData(0,0, detSize, detSize)
  const cornersSmall = detectMarkers(imgSmall.data, detSize, detSize, dbg)

  // Visualize detected finder corners and particle cloud region (no canvas over video so feed stays visible)
  const finderBoxes = cornersSmall && videoWrapEl ? [finderTL, finderTR, finderBR, finderBL] : []
  const pts = cornersSmall ? [cornersSmall.tl, cornersSmall.tr, cornersSmall.br, cornersSmall.bl] : []
  if(finderBoxes.length && pts.length && videoWrapEl){
    const ow = videoWrapEl.clientWidth || 0
    const oh = videoWrapEl.clientHeight || 0
    if(ow && oh){
      const scaleX = ow / detSize
      const scaleY = oh / detSize
      const sz = Math.max(12, ow * 0.08)
      let minX = ow, minY = oh, maxX = 0, maxY = 0
      for(let i = 0; i < 4; i++){
        const pt = pts[i]
        const box = finderBoxes[i]
        const px = pt.x * scaleX
        const py = pt.y * scaleY
        if(minX > px) minX = px
        if(minY > py) minY = py
        if(maxX < px) maxX = px
        if(maxY < py) maxY = py
        if(box && pt){
          box.style.left = (px - sz/2) + "px"
          box.style.top = (py - sz/2) + "px"
          box.style.width = sz + "px"
          box.style.height = sz + "px"
          box.style.display = "block"
        }
      }
      if(particleCloudBoxEl){
        particleCloudBoxEl.style.left = minX + "px"
        particleCloudBoxEl.style.top = minY + "px"
        particleCloudBoxEl.style.width = (maxX - minX) + "px"
        particleCloudBoxEl.style.height = (maxY - minY) + "px"
        particleCloudBoxEl.style.display = "block"
      }
    }
  } else {
    if(finderTL) finderTL.style.display = "none"
    if(finderTR) finderTR.style.display = "none"
    if(finderBR) finderBR.style.display = "none"
    if(finderBL) finderBL.style.display = "none"
    if(particleCloudBoxEl) particleCloudBoxEl.style.display = "none"
  }

  // Keep scanning until all 4 finder markers are detected.
  if(!cornersSmall){
    setStatus("Scanning for markers… align all 4 corner squares in view.")
    if(decodeProgressText) decodeProgressText.textContent = "Frames decoded: " + decodeFramesReceived + " / " + totalLabel()
    renderDecodeDebug(dbg)
    if(video.requestVideoFrameCallback){
      video.requestVideoFrameCallback(()=>decodeLoop())
    }else{
      requestAnimationFrame(decodeLoop)
    }
    return
  }

  // medium sampling canvas for payload extraction
  const sampSize = 720
  const frame = decodeLoop._frame || (decodeLoop._frame = document.createElement("canvas"))
  frame.width = sampSize
  frame.height = sampSize
  const fctx = decodeLoop._fctx || (decodeLoop._fctx = frame.getContext("2d", { willReadFrequently:true }))
  fctx.drawImage(video, sx, sy, side, side, 0,0, sampSize, sampSize)
  const img = fctx.getImageData(0,0, sampSize, sampSize)

  const scale = sampSize / detSize
  const corners = {
    tl: {x: cornersSmall.tl.x*scale, y: cornersSmall.tl.y*scale},
    tr: {x: cornersSmall.tr.x*scale, y: cornersSmall.tr.y*scale},
    br: {x: cornersSmall.br.x*scale, y: cornersSmall.br.y*scale},
    bl: {x: cornersSmall.bl.x*scale, y: cornersSmall.bl.y*scale},
  }

  const frameDecoded = decodePacketFromFrame(img.data, sampSize, sampSize, corners, dbg)
  // Use raw frame-level total only as early UI estimate when sync confidence is strong.
  // Authoritative locking still comes from valid packet parsing below.
  if(
    frameDecoded &&
    frameDecoded.totalChunks > 0 &&
    frameDecoded.totalChunks <= MAX_TOTAL_ESTIMATE &&
    dbg.packet &&
    dbg.packet.syncMatch >= 50
  ){
    considerEstimatedTotal(frameDecoded.totalChunks)
  }
  const pkt = frameDecoded ? frameDecoded.pkt : null
  const parseInfo = { ok: false, reason: "no-packet" }
  if(pkt){
    if(pkt.length < 9){
      parseInfo.reason = "packet-too-short"
    }else{
      const magic = String.fromCharCode(pkt[0],pkt[1],pkt[2],pkt[3])
      if(magic !== MAGIC){
        parseInfo.reason = `bad-magic(${magic})`
      }else{
        parseInfo.ok = true
        parseInfo.reason = `magic=${magic} kind=${pkt[4]} len=${pkt.length}`
        // Extract K from CRC-valid packet headers; this is authoritative and immediate.
        const kind = pkt[4]
        if(kind === 2 && pkt.length >= (5 + 4 + 4 + 1 + 4 + 2 + 2 + 4)){
          let off = 5
          const _fileId = bytesToU32LE(pkt, off); off += 4
          const _seed = bytesToU32LE(pkt, off); off += 4
          const _d = pkt[off]; off += 1
          const kData = bytesToU32LE(pkt, off); off += 4
          const _chunkSize = bytesToU16LE(pkt, off); off += 2
          const payloadLen = bytesToU16LE(pkt, off); off += 2
          const pktLen = off + payloadLen + 4
          if(pktLen <= pkt.length){
            const sliced = pkt.slice(0, pktLen)
            const crc = bytesToU32LE(sliced, pktLen - 4)
            const calc = crc32(sliced.slice(0, pktLen - 4))
            if(calc === crc){
              considerEstimatedTotal(kData)
              setTotalAuthoritative(kData)
            }else{
              parseInfo.reason += " crc-mismatch"
            }
          }else{
            parseInfo.reason += " pktlen-overrun"
          }
        }else if(kind === 1 && pkt.length >= (5 + 4 + 4 + 2 + 4 + 2 + 2 + 4)){
          // Legacy/support path only; current TX no longer emits meta packets.
          const kMeta = bytesToU32LE(pkt, 15)
          considerTotalCandidate(kMeta, 2)
        }
      }
    }
  }
  dbg.parse = parseInfo
  if(pkt && rxFountain){
    const before = rxFountain.progress()
    rxFountain.ingestPacket(pkt)
    const prog = rxFountain.progress()
    if(prog.have > before.have) decodeFramesReceived++
    if(prog.need > 0) considerTotalCandidate(prog.need, 1)
    dbg.ingest = `progress ${before.have}/${before.need} -> ${prog.have}/${prog.need}`
    if(prog.need > 0){
      const pct = Math.min(100, Math.floor((prog.have / prog.need) * 100))
      if(decodeProgressBar) decodeProgressBar.style.width = pct + "%"
      const now = Date.now() / 1000
      if(decodeRateSamples.length === 0 || now - decodeRateSamples[decodeRateSamples.length - 1].t >= 0.5){
        decodeRateSamples.push({ t: now, have: prog.have })
        if(decodeRateSamples.length > 20) decodeRateSamples.shift()
      }
      let timeRemain = ""
      if(decodeRateSamples.length >= 2){
        const first = decodeRateSamples[0], last = decodeRateSamples[decodeRateSamples.length - 1]
        const dt = last.t - first.t
        const dHave = last.have - first.have
        if(dt > 0 && dHave >= 0){
          const rate = dHave / dt
          if(rate > 0.1){
            const remain = Math.max(0, prog.need - prog.have)
            const sec = Math.ceil(remain / rate)
            timeRemain = sec <= 60 ? "~" + sec + " s remaining" : "~" + Math.ceil(sec/60) + " min remaining"
          }
        }
      }
      if(decodeProgressText){
        const counter = "Chunks decoded: " + prog.have + " / " + totalLabel()
        decodeProgressText.textContent = timeRemain ? (counter + " (" + timeRemain + ")") : counter
      }
      const name = rxFountain.meta ? rxFountain.meta.name : "file"
      setStatus("Receiving \"" + name + "\": " + prog.have + "/" + prog.need + " chunks (" + pct + "%).")
    }else{
      setStatus(decodeFramesReceived === 0 ? "Aim at the particle cloud. Chunks decoded: 0 / " + totalLabel() : "Locked signal. Chunks decoded: " + decodeFramesReceived + " / " + totalLabel() + ". Waiting for valid packets…")
      if(decodeProgressText) decodeProgressText.textContent = "Chunks decoded: " + decodeFramesReceived + " / " + totalLabel() + (decodeFramesReceived === 0 ? " (no data yet – check alignment)" : "")
      if(decodeProgressBar) decodeProgressBar.style.width = Math.min(20, decodeFramesReceived * 2) + "%"
    }
    if(rxFountain.isComplete()){
      const bytes = rxFountain.buildFile()
      const blob = new Blob([bytes], { type: rxFountain.meta?.type || "application/octet-stream" })
      const url = URL.createObjectURL(blob)
      const link = document.getElementById("download")
      link.href = url
      link.download = rxFountain.meta?.name || "recovered_file"
      link.style.display = "block"
      if(decodeProgressBar) decodeProgressBar.style.width = "100%"
      if(decodeProgressText) decodeProgressText.textContent = "Done"
      const sizeNote = (rxFountain.totalSize == null) ? " (estimated size; metadata missing)" : ""
      setStatus(`Recovered “${link.download}” (${bytes.length} bytes)${sizeNote}. You can download it now.`)
      if(window.confirm(`Transfer complete. Download "${link.download}" now?`)){
        link.click()
      }
      renderDecodeDebug(dbg)
      return
    }
  }
  renderDecodeDebug(dbg)

  if(video.requestVideoFrameCallback){
    video.requestVideoFrameCallback(()=>decodeLoop())
  }else{
    requestAnimationFrame(decodeLoop)
  }
}

function majority(arr){

let map={}

arr.forEach(v=>map[v]=(map[v]||0)+1)

return Object.keys(map).sort((a,b)=>map[b]-map[a])[0]

}

function attemptRebuild(){

let keys=Object.keys(received)

if(keys.length<3) return
if(rxState.totalFrames != null && keys.length < Math.min(rxState.totalFrames, 10)) return

let ordered=keys.map(Number).sort((a,b)=>a-b)

// decode and ingest packets as they arrive (random order)
for(const k of ordered){
  const corrected = majority(received[k])
  const bytes = bitsToBytes(corrected)
  ingestPacket(bytes)
}

// try to recover missing chunks using parity
attemptFecRecover()

// if we have enough info, rebuild the file
maybeFinalizeFile()

}

function setStatus(msg){
  statusEl.textContent = msg || ""
}

function hideModeButtons(){
  if(modeButtonsEl) modeButtonsEl.style.display = "none"
}

function progressText(prefix){
  const total = rxState.totalFrames
  const got = rxState.gotFrames.size
  if(total == null) return (prefix ? prefix + " " : "") + `Frames captured: ${got}`
  const pct = Math.floor((got/Math.max(1,total))*100)
  return (prefix ? prefix + " " : "") + `Frames captured: ${got}/${total} (${pct}%)`
}

function bytesToBits(u8){
  let out = ""
  for(let i=0;i<u8.length;i++){
    out += u8[i].toString(2).padStart(8,"0")
  }
  return out
}

function bitsToBytes(bitstream){
  const bytes=[]
  const n = bitstream.length - (bitstream.length % 8)
  for(let i=0;i<n;i+=8){
    bytes.push(parseInt(bitstream.substring(i,i+8),2))
  }
  return new Uint8Array(bytes)
}

function asciiToBytes(s){
  const out = new Uint8Array(s.length)
  for(let i=0;i<s.length;i++) out[i] = s.charCodeAt(i) & 0xff
  return out
}

function u32ToBytesLE(n){
  const b = new Uint8Array(4)
  b[0] = n & 255
  b[1] = (n>>>8) & 255
  b[2] = (n>>>16) & 255
  b[3] = (n>>>24) & 255
  return b
}

function bytesToU32LE(b, off){
  return (b[off] | (b[off+1]<<8) | (b[off+2]<<16) | (b[off+3]<<24)) >>> 0
}

function concatBytes(arrays){
  let total = 0
  arrays.forEach(a => total += a.length)
  const out = new Uint8Array(total)
  let off = 0
  arrays.forEach(a => { out.set(a, off); off += a.length })
  return out
}

function shuffleInPlace(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = (Math.random()*(i+1))|0
    const t = arr[i]; arr[i]=arr[j]; arr[j]=t
  }
}

function crc32(u8){
  // fast enough for these packet sizes
  let c = 0xFFFFFFFF
  for(let i=0;i<u8.length;i++){
    c ^= u8[i]
    for(let k=0;k<8;k++){
      c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1)
    }
  }
  return (c ^ 0xFFFFFFFF) >>> 0
}

function u16ToBytesLE(n){
  const b = new Uint8Array(2)
  b[0] = n & 255
  b[1] = (n>>>8) & 255
  return b
}

function bytesToU16LE(b, off){
  return (b[off] | (b[off+1]<<8)) >>> 0
}

// Packet formats (bytes):
// Common prefix: [MAGIC 4][kind u8][fileId u32][crc32 u32][...kind payload...]
// kind=1 meta: [totalSize u32][chunkSize u16][totalChunks u32][nameLen u16][typeLen u16][name][type]
// kind=2 data: [chunkIndex u32][totalChunks u32][dataLen u16][data...]
// kind=3 parity: [groupStart u32][groupSize u16][totalChunks u32][scheme u8][dataLen u16][parityData...]
function buildMetaPacket(meta, totalSize, chunkSize, totalChunks){
  const nameBytes = asciiToBytes((meta.name || "recovered_file").slice(0, 255))
  const typeBytes = asciiToBytes((meta.type || "application/octet-stream").slice(0, 255))
  const kind = new Uint8Array([1])
  const fileId = u32ToBytesLE(FILE_ID)
  const body = concatBytes([
    u32ToBytesLE(totalSize>>>0),
    u16ToBytesLE(chunkSize>>>0),
    u32ToBytesLE(totalChunks>>>0),
    u16ToBytesLE(nameBytes.length),
    u16ToBytesLE(typeBytes.length),
    nameBytes,
    typeBytes
  ])
  const withoutCrc = concatBytes([asciiToBytes(MAGIC), kind, fileId, u32ToBytesLE(0), body])
  const crc = crc32(withoutCrc)
  return concatBytes([asciiToBytes(MAGIC), kind, fileId, u32ToBytesLE(crc), body])
}

function buildDataPacket(chunkIndex, totalChunks, data, chunkSize){
  const kind = new Uint8Array([2])
  const fileId = u32ToBytesLE(FILE_ID)
  const body = concatBytes([
    u32ToBytesLE(chunkIndex>>>0),
    u32ToBytesLE(totalChunks>>>0),
    u16ToBytesLE(data.length),
    data
  ])
  const withoutCrc = concatBytes([asciiToBytes(MAGIC), kind, fileId, u32ToBytesLE(0), body])
  const crc = crc32(withoutCrc)
  return concatBytes([asciiToBytes(MAGIC), kind, fileId, u32ToBytesLE(crc), body])
}

function buildParityPacket(groupStart, groupSize, totalChunks, scheme, parityData, chunkSize){
  const kind = new Uint8Array([3])
  const fileId = u32ToBytesLE(FILE_ID)
  const body = concatBytes([
    u32ToBytesLE(groupStart>>>0),
    u16ToBytesLE(groupSize>>>0),
    u32ToBytesLE(totalChunks>>>0),
    new Uint8Array([scheme & 255]),
    u16ToBytesLE(parityData.length),
    parityData
  ])
  const withoutCrc = concatBytes([asciiToBytes(MAGIC), kind, fileId, u32ToBytesLE(0), body])
  const crc = crc32(withoutCrc)
  return concatBytes([asciiToBytes(MAGIC), kind, fileId, u32ToBytesLE(crc), body])
}

function xorChunks(chunks, chunkSize){
  const out = new Uint8Array(chunkSize)
  for(const c of chunks){
    for(let i=0;i<chunkSize;i++){
      out[i] ^= (c[i] || 0)
    }
  }
  return out
}

function ingestPacket(pkt){
  // minimal size: 4 + 1 + 4 + 4 = 13
  if(pkt.length < 13) return
  const magic = String.fromCharCode(pkt[0],pkt[1],pkt[2],pkt[3])
  if(magic !== MAGIC) return
  const kind = pkt[4]
  const fileId = bytesToU32LE(pkt, 5)
  const crc = bytesToU32LE(pkt, 9)

  // validate CRC (computed with crc field set to 0)
  const pktZero = pkt.slice()
  pktZero[9]=0; pktZero[10]=0; pktZero[11]=0; pktZero[12]=0
  const calc = crc32(pktZero)
  if(calc !== crc) return

  if(rxState.fileId == null) rxState.fileId = fileId
  if(rxState.fileId !== fileId) return

  let off = 13
  if(kind === 1){
    if(pkt.length < off + 4 + 2 + 4 + 2 + 2) return
    const totalSize = bytesToU32LE(pkt, off); off+=4
    const chunkSize = bytesToU16LE(pkt, off); off+=2
    const totalChunks = bytesToU32LE(pkt, off); off+=4
    const nameLen = bytesToU16LE(pkt, off); off+=2
    const typeLen = bytesToU16LE(pkt, off); off+=2
    if(pkt.length < off + nameLen + typeLen) return
    const name = String.fromCharCode(...pkt.slice(off, off+nameLen)); off+=nameLen
    const type = String.fromCharCode(...pkt.slice(off, off+typeLen)); off+=typeLen
    rxState.meta = { name, type, size: totalSize }
    rxState.totalChunks = totalChunks
    rxState.chunkSize = chunkSize
  } else if(kind === 2){
    if(pkt.length < off + 4 + 4 + 2) return
    const chunkIndex = bytesToU32LE(pkt, off); off+=4
    const totalChunks = bytesToU32LE(pkt, off); off+=4
    const dataLen = bytesToU16LE(pkt, off); off+=2
    if(pkt.length < off + dataLen) return
    const data = pkt.slice(off, off+dataLen)
    if(!rxState.totalChunks) rxState.totalChunks = totalChunks
    if(rxState.totalChunks !== totalChunks) return
    if(rxState.chunks.has(chunkIndex)) return
    rxState.chunks.set(chunkIndex, data)
  } else if(kind === 3){
    if(pkt.length < off + 4 + 2 + 4 + 1 + 2) return
    const groupStart = bytesToU32LE(pkt, off); off+=4
    const groupSize = bytesToU16LE(pkt, off); off+=2
    const totalChunks = bytesToU32LE(pkt, off); off+=4
    const scheme = pkt[off]; off+=1
    const dataLen = bytesToU16LE(pkt, off); off+=2
    if(pkt.length < off + dataLen) return
    const data = pkt.slice(off, off+dataLen)
    rxState.parity.push({ groupStart, groupSize, totalChunks, scheme, data })
    if(!rxState.totalChunks) rxState.totalChunks = totalChunks
  }
}

function attemptFecRecover(){
  // Recover at most a few per call to keep UI smooth
  if(!rxState.chunkSize || !rxState.totalChunks) return
  let recovered = 0
  for(const p of rxState.parity){
    if(recovered > 8) break
    const start = p.groupStart
    const end = Math.min(rxState.totalChunks, start + p.groupSize)
    // only supports scheme 0 (all) for single-missing recovery
    if(p.scheme !== 0) continue
    const present = []
    let missing = -1
    for(let i=start;i<end;i++){
      const c = rxState.chunks.get(i)
      if(c) present.push({ idx:i, data:c })
      else missing = (missing === -1) ? i : -2
    }
    if(missing < 0) continue
    const xor = xorChunks(present.map(x=>x.data), rxState.chunkSize)
    // xor with parity to get missing (parityAll = xor(all))
    const out = new Uint8Array(rxState.chunkSize)
    for(let i=0;i<rxState.chunkSize;i++){
      out[i] = xor[i] ^ (p.data[i] || 0)
    }
    // trim later using meta.size
    rxState.chunks.set(missing, out)
    recovered++
  }
}

function maybeFinalizeFile(){
  if(!rxState.meta || !rxState.totalChunks || !rxState.chunkSize) {
    setStatus(progressText())
    return
  }
  const got = rxState.chunks.size
  const need = rxState.totalChunks
  const pct = Math.floor((got/Math.max(1,need))*100)
  setStatus(`Receiving “${rxState.meta.name}”: chunks ${got}/${need} (${pct}%).`)
  if(got < need) return

  // stitch chunks in order and trim to declared size
  const parts = []
  for(let i=0;i<need;i++){
    const c = rxState.chunks.get(i) || new Uint8Array(0)
    parts.push(c)
  }
  let merged = concatBytes(parts)
  merged = merged.slice(0, rxState.meta.size)

  const blob = new Blob([merged], { type: rxState.meta.type || "application/octet-stream" })
  const url = URL.createObjectURL(blob)
  const link = document.getElementById("download")
  link.href = url
  link.download = rxState.meta.name || "recovered_file"
  link.style.display = "block"
  setStatus(`Recovered “${link.download}” (${rxState.meta.size} bytes). You can download it now.`)
}
