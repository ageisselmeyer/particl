<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PartiCl</title>
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
  <header>
    <h1>PartiCl</h1>
    <p class="tagline">Particle cloud transfer</p>
  </header>

  <input type="file" id="fileInput" hidden>

  <div id="modeButtons">
    <button type="button" id="btnEncode">Encode</button>
    <button type="button" id="btnDecode">Decode</button>
  </div>

  <div id="canvasWrap">
    <canvas id="cloud"></canvas>
  </div>

  <div id="videoWrap" hidden>
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div id="decodeProgressWrap" hidden>
    <div id="decodeProgressBarBg">
      <div id="decodeProgressBar"></div>
    </div>
    <div id="decodeProgressText"></div>
  </div>

  <p id="status"></p>
  <a id="download" hidden>Download recovered file</a>

  <script type="module" src="app.js"></script>
</body>
</html>
